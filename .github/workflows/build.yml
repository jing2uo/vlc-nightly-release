name: VLC nightly
on:
  schedule:
    - cron: '43 4 * * 1'
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Optional full VLC master commit SHA'
        type: string
        required: false
      promote_run_id:
        description: 'Promote a successful native build run without rebuilding (initial run: 41523505909)'
        type: string
        required: false
      publish:
        description: 'Publish an eligible production release'
        type: boolean
        default: true
      diagnostics:
        description: 'Run optional GUI, audio, network, relocation and runtime diagnostics (non-blocking)'
        type: boolean
        default: false
      trace_http:
        description: 'Temporary network syscall diagnostics; mandatory results unchanged'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: vlc-nightly
  cancel-in-progress: false
jobs:
  runtime-watch:
    if: github.event_name == 'schedule' && github.event.schedule == '17 5,17 * * *'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.runtime.outputs.changed }}
      upstream_sha: ${{ steps.baseline.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select the latest production source and Qt baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pin=$(python3 scripts/production.py runtime-baseline baseline)
          echo "upstream_sha=$pin" >> "$GITHUB_OUTPUT"
      - name: Compare both architectures without deploying the SDK
        id: runtime
        run: scripts/check-runtime.sh baseline --watch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-watch-diagnostics
          path: |
            baseline/
            work/logs/
          retention-days: 30
  resolve:
    needs: runtime-watch
    if: >-
      always() && !cancelled() && inputs.promote_run_id == '' &&
      (needs.runtime-watch.result == 'skipped' ||
       (needs.runtime-watch.result == 'success' && needs.runtime-watch.outputs.changed == 'true'))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve upstream and immutable SDK inputs once
        id: resolve
        env:
          PIN: ${{ inputs.upstream_sha }}
          GH_TOKEN: ${{ github.token }}
          RUNTIME_PIN: ${{ needs.runtime-watch.outputs.upstream_sha }}
        run: |
          if [[ -n "${RUNTIME_PIN:-}" ]]; then
            PIN=$RUNTIME_PIN
          elif [[ "${GITHUB_EVENT_NAME:-}" == schedule ]]; then
            PIN=$(python3 scripts/production.py schedule)
          fi
          scripts/run-container.sh resolve "$PIN"
          version=$(python3 -c 'import json;print((lambda d: d.get("artifact_version",d["version"]))(json.load(open("work/inputs.json"))))')
          sha=$(python3 -c 'import json;print(json.load(open("work/inputs.json"))["upstream_sha"])')
          build=$(python3 scripts/release.py "$version" "$sha" work/inputs.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: inputs
          path: work/inputs.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resolve-diagnostics
          path: work/logs/
          retention-days: 30
  build:
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-26.04}
          - {arch: aarch64, runner: ubuntu-26.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      ARCH: ${{ matrix.arch }}
      JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: inputs
          path: work
      - name: Measure disk and prepare a 20 GiB planning budget
        run: |
          mkdir -p work/logs
          df -h . | tee work/logs/runner-disk-before.log
          free -m | tee work/logs/runner-memory.log
          # Only unused hosted-runner SDKs. Keep Podman, Flatpak orchestration,
          # system libraries, /usr/bin and the Actions runtime intact.
          if (( $(df -Pk . | awk 'NR==2 {print $4}') < 20971520 )); then
            for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/lib/jvm; do
              if [[ -d $path ]]; then
                sudo du -sk "$path" | tee -a work/logs/reclaimed.log > /dev/null
                sudo rm -rf -- "$path"
              fi
            done
          fi
          df -h . | tee work/logs/runner-disk-after.log
          if (( $(df -Pk . | awk 'NR==2 {print $4}') < 20971520 )); then
            echo 'Less than planning budget after cleanup; inspect resource logs.' >&2
            exit 1
          fi
      - name: Cache compatibility key
        id: cache
        run: |
          # Trusted metadata.py emits shell-quoted assignments.
          # shellcheck disable=SC1090
          source <(python3 scripts/metadata.py env work/inputs.json "$ARCH")
          echo "key=contrib-$ARCH-$CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "complete=work/deps/$CACHE_KEY/complete" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: restore
        with:
          path: work/deps
          key: ${{ steps.cache.outputs.key }}
          # No partial-key restore: SDK/toolchain/recipe changes invalidate it.
      - name: Build in KDE SDK inside rootless Podman
        id: compile
        run: scripts/run-container.sh build "$ARCH"
      - name: Check for completed contrib outputs
        id: completed
        if: always()
        env:
          MARKER: ${{ steps.cache.outputs.complete }}
        run: |
          if [[ -n "$MARKER" && -f "$MARKER" ]]; then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v6
        if: always() && steps.completed.outputs.save == 'true' && steps.restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: work/deps
          key: ${{ steps.cache.outputs.key }}
      - name: Verify native payload in the pinned KDE Platform
        env:
          TRACE_HTTP: ${{ inputs.trace_http }}
          DIAGNOSTICS: ${{ inputs.diagnostics }}
        run: |
          args=()
          if [[ "$DIAGNOSTICS" == true ]]; then args+=(--diagnostics); fi
          if [[ "$TRACE_HTTP" == true ]]; then args+=(--trace-http); fi
          scripts/verify.sh --backend=podman --headless "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always() && steps.compile.outcome == 'success'
        with:
          name: vlc-${{ matrix.arch }}
          path: work/dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Capture final resources
        if: always()
        run: |
          df -h . > work/logs/runner-disk-final.log
          free -m > work/logs/runner-memory-final.log
          podman ps -a > work/logs/containers.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostics-${{ matrix.arch }}
          path: |
            work/logs/
            work/verification/results/
          if-no-files-found: warn
          retention-days: 30
  verify:
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: inputs
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: vlc-*
          path: artifacts
          merge-multiple: true
      - run: scripts/verify-artifacts.sh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: artifacts/
          compression-level: 0
          retention-days: 30
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_run_id != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate the source run and select its immutable artifact ID
        id: source
        env:
          SOURCE_RUN: ${{ inputs.promote_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(python3 scripts/production.py promotion "$SOURCE_RUN")
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.promote_run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - run: scripts/verify-artifacts.sh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: artifacts/
          compression-level: 0
          retention-days: 30
  release:
    needs: [verify, promote]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.verify.result != 'failure' && needs.promote.result != 'failure' &&
      (github.event_name == 'schedule' || inputs.publish) &&
      (needs.verify.result == 'success' || needs.promote.result == 'success')
    environment: production
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: artifacts
      - name: Check current SDK/Platform Qt content without rebuilding
        run: scripts/check-runtime.sh artifacts
      - name: Revalidate the exact candidate and create production metadata
        id: prepare
        env:
          SOURCE_RUN_ID: ${{ inputs.promote_run_id || github.run_id }}
        run: |
          version=$(python3 scripts/production.py prepare artifacts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sign the payload and production metadata digests
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.tar.zst
            artifacts/release.json
            artifacts/current-runtime.json
      - name: Save the publication attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" artifacts/provenance.intoto.jsonl
      - name: Publish immutable verified assets
        run: scripts/publish.sh artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.promote_run_id || github.run_id }}
          VLC_PUBLICATION_APPROVED: production-pair-reviewed
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: publication-diagnostics
          path: artifacts/
          compression-level: 0
          retention-days: 30
  flatpark-notify:
    needs: release
    # Set only after FlatPark accepts the app and associates this repository.
    if: vars.FLATPARK_ACCEPTED == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: flatpark/publish-action@v1
        with:
          app-id: org.videolan.VLCBeta
          tag: ${{ needs.release.outputs.version }}
